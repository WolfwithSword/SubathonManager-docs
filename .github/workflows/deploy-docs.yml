name: Deploy Docs

on:
  push:
    paths:
      - 'wiki/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '!wiki/docs/**.drawio'
      - '!wiki/docs/**.svg'
    branches:
      - main

  repository_dispatch:
    types: [docs-release]

  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. v1.2, nightly)"
        required: true
        default: "nightly"
      set_latest:
        description: "Mark this as the 'latest' alias?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install imaging dependencies
        run: sudo apt-get install -y libcairo2 libfreetype6 libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy nightly
        if: github.event_name == 'push'
        env:
          DOCS_VERSION: nightly
          NOINDEX: true
          DOCS_CANONICAL: false
        run: |
          mike deploy --push --update-aliases nightly --template wiki/overrides/redirect.html
# mike set-default --push nightly --template wiki/overrides/redirect.html 2>/dev/null || true

      - name: Deploy release version
        if: github.event_name == 'repository_dispatch'
        env:
          DOCS_VERSION: ${{ github.event.client_payload.version }}
          NOINDEX: false
          DOCS_CANONICAL: true
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "nightly" ]; then
            echo "::error::Refusing to publish '$VERSION' as a release. 'nightly' (or an empty version) must never become the 'latest' alias."
            exit 1
          fi
          mike deploy --push --update-aliases "$VERSION" latest --template wiki/overrides/redirect.html
          mike set-default --push latest --template wiki/overrides/redirect.html

      - name: Deploy manual version
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCS_VERSION: ${{ github.event.inputs.version }}
          NOINDEX: ${{ github.event.inputs.set_latest == 'false' || github.event.inputs.version == 'nightly' }}
          DOCS_CANONICAL: ${{ github.event.inputs.set_latest == 'true' && github.event.inputs.version != 'nightly' }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          SET_LATEST="${{ github.event.inputs.set_latest }}"
          if [ "$VERSION" = "nightly" ] && [ "$SET_LATEST" = "true" ]; then
            echo "::warning::'nightly' cannot be marked as latest - deploying it as a plain version instead."
            SET_LATEST="false"
          fi
          if [ "$SET_LATEST" = "true" ]; then
            mike deploy --push --update-aliases "$VERSION" latest --template wiki/overrides/redirect.html
            mike set-default --push latest --template wiki/overrides/redirect.html
          else
            mike deploy --push "$VERSION" --template wiki/overrides/redirect.html
          fi
